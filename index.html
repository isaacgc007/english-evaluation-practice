function writingCard(q,r){return `<p>✏️ Write the missing letter or letters below, or use pencil and paper.</p><canvas id="writing-pad" width="720" height="240" aria-label="Handwriting practice area. You can also write on paper."></canvas><div class="actions"><button id="clear-writing" ${r?.done?'disabled':''}>Clear writing</button></div><p>Grown-up: check the sound and the letter Jacob wrote.</p>${day.mock?'':`<details class="sample"><summary>Grown-up: check after Jacob writes</summary>The sound is written <b>${esc(q.correctAnswer)}</b>. Listen for the ${q.subskill==='begin'?'first':'last'} sound in ${esc(q.word)}.</details>`}${ratings(r)}`;}
function setupWriting(q){const canvas=document.getElementById('writing-pad');if(!canvas?.getContext)return;const ctx=canvas.getContext('2d');if(!ctx)return;let drawing=false;const r=record(q);ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#21334d';
 const guide=()=>{ctx.clearRect(0,0,720,240);ctx.save();ctx.strokeStyle='#c3d4cc';ctx.lineWidth=2;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(25,160);ctx.lineTo(695,160);ctx.stroke();ctx.restore();};guide();
 if(r?.writing){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,720,240);ctx.drawImage(im,0,0);};im.src=r.writing;}
 const point=e=>{const box=canvas.getBoundingClientRect();return [(e.clientX-box.left)*720/box.width,(e.clientY-box.top)*240/box.height];};
 const persist=()=>{const p=progress(day.day);p.answers[q.id]={attempts:[],done:false,...p.answers[q.id],writing:canvas.toDataURL('image/png')};save();};
 canvas.onpointerdown=e=>{if(record(q)?.done)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;const [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();};
 canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();const [x,y]=point(e);ctx.lineTo(x,y);ctx.stroke();};
 canvas.onpointerup=canvas.onpointercancel=()=>{if(drawing){drawing=false;persist();}};
 document.getElementById('clear-writing').onclick=()=>{if(record(q)?.done)return;guide();persist();};
}

function connectRhyme(q,b){const board=document.getElementById('rhyme-board'),anchor=document.getElementById('rhyme-anchor'),line=document.getElementById('pair-line');if(!board||!anchor||!line||!b?.getBoundingClientRect)return;const box=board.getBoundingClientRect(),a=anchor.getBoundingClientRect(),target=b.getBoundingClientRect();line.setAttribute('x1',a.right-box.left);line.setAttribute('y1',a.top+a.height/2-box.top);line.setAttribute('x2',target.left-box.left);line.setAttribute('y2',target.top+target.height/2-box.top);line.setAttribute('stroke',day.mock||b.dataset.answer===q.correctAnswer?'#25857d':'#c39437');}

function finishReading(rating){const p=progress(day.day);p.wordReading=p.wordReading||{};readingTokens().forEach((_,i)=>{if(!p.wordReading[i])p.wordReading[i]=rating==='independent'?'independent':'not_checked';});p.readingAloud=rating==='independent'&&Object.values(p.wordReading).some(v=>v==='revisit')?'revisit':rating==='independent'&&Object.values(p.wordReading).some(v=>v==='help')?'help':rating;save();renderMission();}
function readingWordNotes(n){const p=state.days[n];if(!p?.wordReading)return 'No word checks yet';const words=EXERCISES[n-1].reading.passage.split(/\s+/);const help=Object.entries(p.wordReading).filter(([,s])=>['help','revisit'].includes(s)).map(([i,s])=>`${words[i]} (${s==='help'?'helped':'revise'})`);return help.length?help.join(', '):Object.values(p.wordReading).every(v=>v==='independent')?'All words marked independent':'Some words not individually checked';}

function completed(n){return ['phonics','oral','reading'].every(m=>state.days[n]?.missions[m]);}
function stars(n){return Object.keys(state.days[n]?.missions||{}).filter(m=>state.days[n].missions[m]).length;}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function dateNumber(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000;}
function available(n){return state.unlockAll||dateNumber(today())>=dateNumber(n<=10?'2026-10-05':'2026-10-28')+(n<=10?n-1:n-11);}
function dayDate(n){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(n<=10?Date.UTC(2026,9,4+n):Date.UTC(2026,9,17+n)));}
function home(){day=null;mission=null;const done=EXERCISES.filter(d=>completed(d.day)).length;const block=EXERCISES.filter(d=>selectedBlock===1?d.day<=10:d.day>10);const next=block.find(d=>available(d.day)&&!completed(d.day));app.innerHTML=`<section class="hero"><div><div class="eyebrow">20 daily adventures · keep growing</div><h1>Ready to shine,<br>Jacob?</h1><p>Find sounds. Tell stories. Read something new.<br>A little English adventure, every day.</p><button class="primary" id="start">${next?'Start Day '+next.day:'Choose a day to revisit'} →</button><p class="status">New sessions: 28 Oct–6 Nov · 10–15 minutes with a grown-up</p></div><div class="space" aria-hidden="true"><span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✧</span><div class="planet">🚀</div></div></section><section class="progress"><div class="row"><h3>Your star journey</h3><span class="badge">${done} of ${TOTAL_DAYS} days complete</span></div><div class="bar"><span style="width:${done/TOTAL_DAYS*100}%"></span></div></section><div class="notice">New: Days 11–20 are ready. Choose any session with a grown-up; you can work at your own pace. Days 21–30 are still to come.</div>${!storageOK?'<p role="alert">Progress could not be saved. Export your progress before closing this page.</p>':''}<div class="actions" role="group" aria-label="Choose practice days"><button id="first-block" aria-pressed="${selectedBlock===1}">Days 1–10</button><button id="new-block" aria-pressed="${selectedBlock===11}">New · Days 11–20</button></div><h2>${selectedBlock===11?"Your next ten adventures":"Your first ten adventures"}</h2><div class="grid">${block.map(d=>`<button class="day ${completed(d.day)?'done':''}" data-day="${d.day}" ${available(d.day)?'':'disabled'}><span class="number">${completed(d.day)?'★':available(d.day)?String(d.day).padStart(2,'0'):'🔒'}</span><small>${dayDate(d.day)}${d.mock?' · MINI MOCK':''}</small><b>${esc(d.title)}</b><small>${stars(d.day)?stars(d.day)+' / 3 mission stars':available(d.day)?'Ready to explore':'Unlocks '+dayDate(d.day)}</small></button>`).join('')}</div><p class="muted">Days 11–20: body and family words, healthy living, senses, weather, Wonderful Earth and the environment. Evaluation window: 4–13 November 2026. <a href="parent-review.html" target="_blank" rel="noopener">Grown-up: review questions and answers</a></p>`;document.getElementById('first-block').onclick=()=>{selectedBlock=1;home();};document.getElementById('new-block').onclick=()=>{selectedBlock=11;home();};document.getElementById('start').onclick=()=>next?openDay(next.day):document.querySelector('.grid').scrollIntoView({behavior:'smooth'});app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(+b.dataset.day));window.scrollTo(0,0);}
function openDay(n){if(!available(n))return;day=EXERCISES[n-1];mission=null;progress(n);save();const s=stars(n);app.innerHTML=`<button id="back">← Star journey</button><div class="row"><div><p class="eyebrow">Day ${n} · ${dayDate(n)}</p><h1>${esc(day.title)}</h1><p>${esc(day.focus)}</p></div><span class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></div>${day.mock?'<div class="notice">Mini mock: try each answer once. Answers and feedback appear after all three missions. A grown-up checks speaking and reading aloud.</div>':''}<div class="missions">${[['phonics','🔤','Sound explorers',day.phonics.length+' sound challenges · levelled up'],['oral','💬','Say it your way',day.oral.length+' complete sentences'],['reading','📖','Story time','Read, understand & match']].map(([m,icon,t,desc])=>`<button class="mission" data-mission="${m}"><span class="icon">${icon}</span><h3>${t}</h3><p>${desc}</p><span class="badge">${progress(n).missions[m]?'★ Completed · revisit':'Let’s begin →'}</span></button>`).join('')}</div><details class="sample"><summary>Grown-up: restart Sound explorers</summary><p>This clears the current sound answers for this day. Speaking and reading records stay saved. Export progress first to keep a copy.</p><button id="restart-sounds">Clear sound answers and start again</button></details>${completed(n)?'<div class="card celebrate"><div class="picture">🌟</div><h2>You did it, Jacob!</h2><p>Three missions, three bright stars. You kept practising!</p><button id="review-day" class="primary">Review with a grown-up</button></div>':''}`;document.getElementById('back').onclick=home;app.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>{mission=b.dataset.mission;index=0;renderMission();});document.getElementById("restart-sounds").onclick=()=>{const p=progress(n);day.phonics.forEach(q=>delete p.answers[q.id]);delete p.missions.phonics;save();mission="phonics";index=0;renderMission();};if(completed(n))document.getElementById('review-day').onclick=reviewDay;window.scrollTo(0,0);}
function questions(){return mission==='phonics'?day.phonics:mission==='oral'?day.oral:day.reading.questions;}
function record(q){return progress(day.day).answers[q.id];}
function rotated(q){const sum=[...q.id].reduce((a,c)=>a+c.charCodeAt(0),0),a=[...q.answers],shift=sum%a.length;return a.slice(shift).concat(a.slice(0,shift));}
function speak(text){if(!('speechSynthesis'in window)){document.getElementById('feedback').textContent='Please ask your grown-up to read this aloud.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u);}
function scene(type){const base='<rect x="0" y="0" width="420" height="225" rx="20" fill="#e5f2eb"/><path d="M0 185H420" stroke="#b1d3bd" stroke-width="5"/>';const child=(x,pose='')=>`<circle cx="${x}" cy="65" r="20" fill="#f2c5a1"/><path d="M${x-20} 98h40v58h-40z" fill="#497ca3"/><path d="M${x-12} 155l-12 28m38-28l${pose==='kick'?'36':'10'} 28M${x-20} 110l-25 ${pose==='catch'?'-20':'18'}m65-18l25 ${pose==='catch'?'-20':'18'}" stroke="#21334d" stroke-width="9" stroke-linecap="round"/>`;const text=(x,y,t,size=65)=>`<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle">${t}</text>`;const art={treepaint:child(110)+'<rect x="205" y="30" width="140" height="145" rx="8" fill="white"/>'+text(275,145,'🌳',80)+'<path d="M150 120l35-20" stroke="#276f65" stroke-width="7"/>',duckball:'<path d="M115 105q-45 0-40 40q8 42 80 20q25-8 18-30q-18 15-40 8V105" fill="#f2cd39"/><circle cx="122" cy="103" r="25" fill="#f2cd39"/><circle cx="129" cy="97" r="3" fill="#21334d"/><path d="M142 103l22 7-24 7" fill="#d89236"/><circle cx="290" cy="145" r="42" fill="#4c84c6"/><path d="M260 119q30 25 60 0M260 171q30-25 60 0" fill="none" stroke="#a4c7ef" stroke-width="4"/>',dogbook:child(120)+child(255)+text(180,143,'📖',50)+text(355,181,'🐶',62),twokids:child(135)+child(285),book:child(140)+child(280)+text(210,145,'📖'),sun:child(110)+text(280,135,'☀️')+'<path d="M150 140h75" stroke="#397d72" stroke-width="6"/>',bus:'<rect x="70" y="177" width="280" height="20" rx="8" fill="#f1c76f"/>'+text(210,170,'🚌',105),catball:text(160,170,'🐱',95)+text(290,180,'⚽',60),doghat:text(210,177,'🐶',100)+text(210,88,'🎩',65),box:'<path d="M120 100h180v85H120z" fill="#c88e56"/><path d="M120 100l-35-20h180l35 20" fill="#e9b97b"/>'+text(173,128,'🐷',45)+text(245,128,'🐶',45),cup:'<path d="M75 140h270M100 140v50m220-50v50" stroke="#a47852" stroke-width="12"/>'+text(210,136,'☕',75),catch:child(210,'catch')+text(210,111,'⚽',45),doglog:text(145,175,'🐶',100)+text(290,183,'🪵',75),kick:child(145,'kick')+text(280,185,'⚽',55)};if(NEW_SCENES[type])return NEW_SCENES[type];return `<div class="scene"><svg viewBox="0 0 420 225" role="img" aria-label="Practice picture. Ask a grown-up for a description if needed.">${base}${art[type]||''}</svg></div>`;}
function renderMission(){if(mission==='reading'&&index===0&&!progress(day.day).readingAloud){renderPassage();return;}const qs=questions(),q=qs[index],r=record(q),finished=!!r?.done;let content='';if(mission==='phonics'){const units=q.soundUnits||q.word.split(''),n=q.correctAnswer?.length||1;const word=q.subskill==='begin'?'_'.repeat(n)+q.word.slice(n):q.subskill==='end'?q.word.slice(0,-n)+'_'.repeat(n):q.subskill==='middle'?q.word[0]+'_'+q.word.slice(2):q.subskill==='blend'?units.join(' · '):q.word;const instructions={begin:'Write the first sound.',middle:'Circle the middle sound.',end:'Write the last sound.',rhyme:`Which word rhymes with ${q.word}?`,blend:'Say each sound. Then blend the word.',segment:'Say the word. Then say each sound.'};content=`${q.stretch?'<div class="eyebrow">Stretch practice · extra challenge</div>':''}<h2>${instructions[q.subskill]}</h2><button id="listen">🔊 Listen to the word</button>${q.subskill==='rhyme'?'':`<div class="picture" aria-hidden="true">${q.picture||'🔤'}</div><div class="word">${esc(word)}</div>`}${['begin','end'].includes(q.subskill)?writingCard(q,r):q.answers.length?options(q,finished):`<p>Grown-up: listen to Jacob ${q.subskill==='blend'?'blend the sounds into a word':'say each sound in order'}.</p>${day.mock?'':`<details class="sample"><summary>Grown-up sound guide</summary>Use short sounds, not letter names: ${esc(units.join(' / '))}. ${units.some(s=>s.length>1)?'Joined letters such as sh, ch, th, ck, ll, ss, ee, ea or ai represent one sound in these guides. ':''}${q.subskill==='segment'?'Listen for '+units.length+' sounds.':'Then say '+q.word+'.'}</details>`}${ratings(r)}`}`;
}else if(mission==='oral'){content=`<div class="eyebrow">Say it aloud</div><h2>${esc(q.question)}</h2><p>💬 Use a complete sentence. Your own ideas are welcome!</p><button id="listen">🔊 Listen to the question</button>${day.mock?'':`<details class="sample"><summary>Grown-up: show an example after Jacob tries</summary>${esc(q.sampleAnswers[0])}<p>Accept any relevant, understandable complete sentence. This is one example, not an answer to memorise.</p></details>`}<p>Grown-up: how did Jacob answer?</p>${ratings(r)}`;}else{content=`<div class="eyebrow">${q.subskill==='picture_sentence'?'Look & match':'Think about the story'}</div><h2>${esc(q.question)}</h2>${q.scene?scene(q.scene):`<details class="sample" open><summary>Read the story again</summary><div class="passage">${esc(day.reading.passage)}</div></details>`}${options(q,finished)}`;}
app.innerHTML=`<div class="row"><button id="back">← Day ${day.day}</button><span class="badge">${mission==='oral'?'Speaking':mission==='phonics'?'Phonics':'Reading'} · ${index+1} / ${qs.length}</span></div><div class="bar" style="margin-top:20px"><span style="width:${index/qs.length*100}%"></span></div><section class="card question ${mission==='reading'?'reading-question':''} ${q.subskill==='middle'?'vowel':''}">${content}<div id="feedback" class="feedback" role="status" aria-live="polite">${finished?(day.mock?'Answer saved.':r.rating?'Your grown-up saved your practice.':'⭐ You found it!'):''}</div><div class="row"><button id="previous" ${index===0?'disabled':''}>← Back</button><button id="next" class="primary" ${finished?'':'disabled'}>${index===qs.length-1?'Finish mission ★':'Next →'}</button></div></section>`;
document.getElementById('back').onclick=()=>openDay(day.day);document.getElementById('previous').onclick=()=>{index--;renderMission();};document.getElementById('next').onclick=()=>{if(index<qs.length-1){index++;renderMission();}else{progress(day.day).missions[mission]=true;save();openDay(day.day);}};if(document.getElementById('listen'))document.getElementById('listen').onclick=()=>speak(q.question||q.word);app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(q,b));app.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>rate(q,b.dataset.rating));if(['begin','end'].includes(q.subskill))setupWriting(q);if(q.subskill==='rhyme'&&r?.attempts?.length){const a=r.attempts[r.attempts.length-1].answer;const selected=[...app.querySelectorAll('[data-answer]')].find(b=>b.dataset.answer===a);if(selected)connectRhyme(q,selected);}window.scrollTo(0,0);}
function options(q,finished){if(q.subskill==='rhyme')return rhymeBoard(q,finished);return `<div class="options">${rotated(q).map(a=>`<button data-answer="${esc(a)}" ${finished?'disabled':''}>${q.subskill==='rhyme'?(PICTURES[a]||'')+' ':''}${esc(a)}</button>`).join('')}</div>`;}
function ratings(r){return `<div class="actions">${[['independent','🙂 Did it independently'],['help','🤝 Needed some help'],['revisit','🌱 Practise again later']].map(([v,t])=>`<button data-rating="${v}" ${r?.done?'disabled':''}>${t}</button>`).join('')}</div><p class="muted">${mission==='oral'?'Check: a relevant full sentence, a clear voice, and how much prompting was needed.':'Use “Practise again later” if the skill still needs revision.'} Progress is checked by a grown-up.</p>`;}
function choose(q,b){const p=progress(day.day),r=p.answers[q.id]||(p.answers[q.id]={attempts:[],done:false});if(r.done)return;const answer=b.dataset.answer,correct=answer===q.correctAnswer;if(q.subskill==='rhyme')connectRhyme(q,b);r.attempts.push({answer,correct,at:new Date().toISOString()});r.firstCorrect=r.attempts[0].correct;r.done=day.mock||correct;save();if(day.mock){renderMission();return;}b.classList.remove('correct','wrong');b.classList.add(correct?'correct':'wrong');const feedback=document.getElementById('feedback');feedback.textContent=correct?'⭐ Great job!':'Almost! Try another answer.';if(!correct&&r.attempts.length>=2){feedback.textContent=q.hint||'Look back at the story or picture. Ask your grown-up to help you find the clue.';}if(correct){app.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);document.getElementById('next').disabled=false;}}
function rate(q,value){const old=record(q);progress(day.day).answers[q.id]={...old,attempts:old?.attempts||[],rating:value,done:true,at:new Date().toISOString()};save();renderMission();}
function renderPassage(){app.innerHTML=`<button id="back">← Day ${day.day}</button><section class="card question"><div class="eyebrow">Story time · read aloud</div><h2>A brand-new little story</h2>${wordReadingCard()}<p>Grown-up: let Jacob read first. Mark words that needed help, then try the questions.</p><div class="actions"><button data-read="independent" class="primary">Read independently →</button><button data-read="help">Read with help →</button><button data-read="revisit">Needs more practice →</button></div></section>`;document.getElementById('back').onclick=()=>openDay(day.day);setupWordReading();app.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>finishReading(b.dataset.read));}
function reviewDay(){const p=progress(day.day);app.innerHTML=`<button id="back">← Day ${day.day}</button><h1>Your practice notes</h1><p>Grown-up review · Celebrate effort, then revisit a tricky sound together.</p><section class="card"><h2>Sounds & reading</h2>${[...day.phonics,...day.reading.questions].map(q=>{const r=p.answers[q.id];return `<p><b>${esc(q.word||q.question)}</b><br>${q.correctAnswer?'Answer: '+esc(q.correctAnswer):'Say '+esc(q.word)+' / '+esc((q.soundUnits||q.word.split('')).join(' / '))} · ${r?.rating?esc(r.rating):r?.firstCorrect?'First try ✓':'A little more practice'}${day.mock&&r?.attempts?.length?' · Chose: '+esc(r.attempts[0].answer):''}</p>`;}).join('')}<h2>Speaking</h2>${day.oral.map(q=>`<p><b>${esc(q.question)}</b><br>Example: ${esc(q.sampleAnswers[0])}<br>Grown-up rating: ${esc(p.answers[q.id]?.rating||'Not checked')}</p>`).join('')}<p>Reading aloud: ${esc(p.readingAloud||'Not checked')}</p><p>Words to practise: ${esc(readingWordNotes(day.day))}</p><button id="retry" class="secondary">Start this day again</button><p class="muted">Restarting clears this day’s saved attempts. Export progress first if you want to retain them.</p></section>`;document.getElementById('back').onclick=()=>openDay(day.day);document.getElementById('retry').onclick=()=>{if(confirm('Clear this day’s saved practice and start again?')){delete state.days[day.day];save();openDay(day.day);}};}
function parentGate(){app.innerHTML='<button id="back">← Star journey</button><section class="card question"><h2>A moment for the grown-ups</h2><p>Hold the button for two seconds to open progress and settings. With a keyboard, hold Enter or Space.</p><button class="primary hold" id="hold">Hold to open Parent mode</button><p id="gate-status" role="status"></p><details class="sample"><summary>Use a grown-up question instead</summary><label for="gate-answer">What is 7 + 5?</label><input id="gate-answer" inputmode="numeric" autocomplete="off" size="4"><button id="gate-open">Open parent notebook</button></details></section>';document.getElementById('back').onclick=home;const b=document.getElementById('hold');const begin=()=>{if(gateTimer)return;document.getElementById('gate-status').textContent='Keep holding…';gateTimer=setTimeout(()=>{gateTimer=null;parent();},2000);};const end=()=>{clearTimeout(gateTimer);gateTimer=null;const s=document.getElementById('gate-status');if(s)s.textContent='';};b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);begin();};b.onpointerup=end;b.onpointercancel=end;b.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();begin();}};b.onkeyup=end;b.onblur=end;document.getElementById('gate-open').onclick=()=>{if(document.getElementById('gate-answer').value.trim()==='12'){end();parent();}else document.getElementById('gate-status').textContent='Ask a grown-up to check the answer.';};}
function parent(){const totals={};for(const d of EXERCISES){for(const q of [...d.phonics,...d.oral,...d.reading.questions]){const r=state.days[d.day]?.answers[q.id];if(!r)continue;const needs=r.rating?r.rating!=='independent':r.attempts?.some(a=>!a.correct);if(needs)totals[q.subskill]=(totals[q.subskill]||0)+1;}}const suggestions=Object.entries(totals).sort((a,b)=>b[1]-a[1]);app.innerHTML=`<button id="back">← Star journey</button><h1>Parent notebook</h1><div class="notice">Days 11–20 were added on 28 October after direct review of the new October homework, the current revision-scope sheet and English plans through Week 10. New topics include healthy living, senses, weather, Wonderful Earth and the environment. The confirmed House for Sale keywords are for, house, everyone, this, room and chair. Stories are original; these are practice questions, not the actual evaluation paper. Marked stretch phonics goes beyond the stated CVC blending requirement. Days 1–10 questions and their saved progress remain available.</div><section class="card"><h2>Practice settings</h2><label><input id="unlock" type="checkbox" ${state.unlockAll?'checked':''}>Unlock all 20 days for review and catching up</label><p class="muted">When unchecked, Days 1–10 follow 5–14 October and Days 11–20 follow 28 October–6 November (Hong Kong / Shanghai time). Earlier days stay available. Leave all days unlocked to choose your own pace.</p><button id="export" class="primary">Export progress JSON ↓</button><div id="backup" hidden><p>Your backup is ready. If the file download does not start, copy the text below into a file and keep it private.</p><label for="backup-text">Progress backup JSON</label><textarea id="backup-text" rows="7" readonly style="width:100%;font-size:14px"></textarea></div><p class="muted">Progress stays in this browser. It does not sync between devices. Downloads may contain your practice records; keep them private.</p><p>${storageOK?'Local saving is available.':'Local saving failed. Keep an exported copy.'}</p></section><section class="card"><h2>Try these again together</h2>${suggestions.length?`<ul class="list">${suggestions.map(([k,v])=>`<li>${esc(k.replaceAll('_',' '))}: ${v} question${v===1?'':'s'} needed help or another try${v>=2?' — revisit this skill in a short session':''}.</li>`).join('')}</ul>`:'<p>Practice notes will appear after Jacob has a go.</p>'}<p>For speaking: check full sentences, relevance, a clear voice and independent answering. Speech is assessed by you.</p></section><section class="card"><h2>Day-by-day notes</h2><div class="scroll"><table class="report"><thead><tr><th>Day</th><th>Stars</th><th>Phonics attempts</th><th>Speaking independent</th><th>Reading first try</th><th>Read aloud</th><th>Word notes</th></tr></thead><tbody>${EXERCISES.map(d=>{const a=state.days[d.day]?.answers||{};return `<tr><td>${d.day} · ${esc(d.title)}</td><td>${stars(d.day)}/3</td><td>${d.phonics.reduce((s,q)=>s+(a[q.id]?.attempts?.length||0),0)}</td><td>${d.oral.filter(q=>a[q.id]?.rating==='independent').length}/${d.oral.length}</td><td>${d.reading.questions.filter(q=>a[q.id]?.firstCorrect).length}/${d.reading.questions.length}</td><td>${esc(state.days[d.day]?.readingAloud||'—')}</td><td>${esc(readingWordNotes(d.day))}</td></tr>`;}).join('')}</tbody></table></div></section><button id="reset">Reset all local progress</button>`;document.getElementById('back').onclick=home;document.getElementById('unlock').onchange=e=>{state.unlockAll=e.target.checked;save();};document.getElementById('export').onclick=exportProgress;document.getElementById('reset').onclick=()=>{if(confirm('Clear all 20 days of saved progress? Export a copy first if needed.')){state={version:2,unlockAll:true,days:{},lastActive:null};save();parent();}};}
document.getElementById('home-link').onclick=e=>{e.preventDefault();home();};document.getElementById('parent-button').onclick=parentGate;home();
</script></body></html>
